<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade - Rede Social</title>
    <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">

    <!-- jQuery e Socket.io importados por CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>
<body>

    <header class="topo">
        <img src="/img/logo.svg" alt="Logo da rede social" class="logo">
        <h1>ATIVIDADE - REDE SOCIAL</h1>
    </header>

    <nav class="barra">
        <button type="button" id="btnAbrirModal" class="btn-verde">POST</button>
    </nav>

    <main class="conteudo">
        <section id="posts" class="feed">
            <p class="aviso" id="avisoVazio">Carregando posts...</p>
        </section>
    </main>

    <!-- Modal "FAÇA UM POST" -->
    <div id="modal" class="modal-fundo" aria-hidden="true">
        <div class="modal" role="dialog" aria-labelledby="tituloModal">
            <button type="button" id="btnFecharModal" class="fechar" aria-label="Fechar">&times;</button>

            <h2 id="tituloModal">FAÇA UM POST</h2>

            <form id="formPost" autocomplete="off">
                <input type="text" id="titulo" name="titulo" placeholder="Título do post" maxlength="120" required>
                <input type="text" id="conteudo" name="conteudo" placeholder="O que você quer compartilhar?" maxlength="2000" required>
                <p id="erroForm" class="erro"></p>
                <button type="submit" class="btn-verde">POSTAR</button>
            </form>
        </div>
    </div>

    <script src="/js/main.js"></script>
</body>
</html>
